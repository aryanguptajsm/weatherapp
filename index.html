<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/clouds.png" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
 <nav class="navbar">
    <h2>Weather App</h2>
    <div class="search">
        <input type="text" id="city" placeholder="Enter city name" >
       <i class="fa-solid fa-magnifying-glass" alt="Search" class="search-icon" onclick="document.getElementById('getWeatherButton').click()"></i>
    </div>
    <button id="getWeatherButton">Get Weather</button>
    </nav>
    <div class="main">
        <h1><span id="cityName">London</span></h1>
        <div class="weather-icon">
            <img id="weatherIcon" src="none" alt="Weather Icon">
        </div>
        <p> <span class="temp" id="temperature">--</span></p>
         <div class="weather-description">
            <p>Weather: <span id="weatherDescription">--</span></p>
        </div>
      <div class="humidity">
            <div class="humidity-item">
                <img src="images/humidity.png" alt="Humidity Icon" class="icon-small"> 
                <p>Humidity: <span id="humidityValue">--</span></p>
            </div>
            <div class="wind-item">
                <img src="images/wind.png" alt="Wind Speed Icon" class="icon-small">
                <p>Wind: <span id="windSpeedValue">--</span></p>
            </div>
        </div>
     
    </div>
  
 
    <script src="script.js"></script>
</body>
</html>
