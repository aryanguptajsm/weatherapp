<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
 <nav class="navbar">
    <h2>Weather App</h2>
    <div class="search">
        <input type="text" id="city" placeholder="Enter city name" >
        <i class="fa-solid fa-magnifying-glass" onclick="document.getElementById('getWeatherButton').click()"></i>
    </div>
    <button id="getWeatherButton">Get Weather</button>
    </nav>
    <div class="main">
        <h1><span id="cityName">London</span></h1>
        <p>Weather: <span class="weather" id="weatherDescription">--</span></p>
        <p> <span class="temp" id="temperature">--</span></p>
        <p>Humidity: <span class="humidity" id="humidityValue">--</span></p> 
        <p> Wind Speed: <span class="wind-speed" id="windSpeedValue">--</span></p>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
